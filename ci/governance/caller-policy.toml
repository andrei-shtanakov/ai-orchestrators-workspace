# caller-policy.toml — SSOT политики пинов governance-каллеров.
# Потребитель: check_caller_pins.py (meta-enforcer, workflow caller-pins.yml).
#
# Решение владельца 2026-08-25 (evidence-сверка ADR-ECO-009): пин по commit SHA,
# двухэтапный rollout. Тег governance-v2 защищён tag-ruleset'ом `governance-rule`
# (creation/update/deletion/non-FF заблокированы), но ruleset имеет bypass actors
# (RepositoryRole, DeployKey, владелец — always): SHA-пин снимает остаточное
# доверие к настройкам репо и админ-контуру.
#
# Канон = merge-SHA control-PR #19 (51513e8): первый коммит main, содержащий
# и политику, и enforcer — пин, который сам несёт свой контроль.
# До схождения флота (22 caller-PR) прогоны caller-pins будут красными по
# немигрировавшим репо — это ожидаемый сигнал rollout'а, не поломка.

schema_version = "1"

[pin]
# Канонический ref: и `uses: ...governance-gate.yml@<ref>`, и `umbrella-ref: "<ref>"`.
ref = "51513e8aa0935e76b3327d6298409a683960a6fb"
# true → ref обязан быть 40-hex commit SHA (ветки и теги запрещены политикой).
require_sha = true

[inputs.defaults]
# Каллер обязан задавать все три input'а явно и ровно так, если нет override ниже.
strict = true
runtime-scan = true
authority-guard = false

# Документированные per-repo отклонения (ключ = имя GitHub-репо).
# Недокументированное отклонение — находка meta-enforcer'а.

[inputs.overrides.prograph-vault]
# KB, не runtime-репо: guard advisory (strict off), сканировать нечего,
# но authority-root пути (authored/registry/governance.yaml) он держит.
strict = false
runtime-scan = false
authority-guard = true

[inputs.overrides.robin-toolkit]
# В репо нет кода — только шаблоны и спека; GOV-003 нечего сканировать.
runtime-scan = false

# --- GOV-003: пути, которые НЕ runtime-код ----------------------------------
# Ступень между `runtime-scan = false` (весь репо) и `gov:allow-cowork-file`
# (весь файл, маркером ВНУТРИ файла). Объявленный путь получает то же обращение,
# что `.md`: проза, не код. Это директива сканеру, а не waiver инварианта —
# читающий эти данные код лежит снаружи и сканируется как прежде.
#
# Объявление живёт ЗДЕСЬ, а не в каллере и не в сканируемом дереве, по двум
# причинам. Первая — трастовая: сканируемый репо не может расширить себе
# исключение, это может только PR в зонтик. Вторая — практическая: evidence
# нельзя править руками, а файловый/строчный маркер требует именно этого.
#
# Каждый объявленный путь ПЕЧАТАЕТСЯ гейтом в каждом прогоне (`[data ]`), так что
# репо, тихо объявивший `src`, виден в логе. `.`, `..` и абсолютные пути чекер
# отвергает кодом 2: выключать весь репо можно только входом `runtime-scan`.
[data-artifacts]
# impresario: `pilot/` — живой workspace с реальной историей, объявленный
# evidence в его CLAUDE.md («Treat it as evidence, not scratch data — don't
# regenerate or hand-edit its records»). Кода там нет вовсе (76 yaml, 4 md,
# state/jsonl — ни одного .py). Брифы цитируют текст стандартов, в котором
# STD-5 НАЗЫВАЕТ `_cowork_output`, — гейт падал на фразе, формулирующей сам
# инвариант GOV-003, и 8 таких находок держали репо красным.
impresario = ["pilot"]

[fleet]
# Члены workspace-manifest.toml, которым каллер намеренно не нужен.
# Пусто: на 2026-08-25 каллер есть у всех 22 репо манифеста.
exempt = []
