# CANONICAL CALLER — copy this to each subproject's `.github/workflows/governance.yml`.
# ADR-ECO-004 D5. This is a THIN CALLER: a pinned reference to the reusable gate workflow at
# ai-orchestrators-workspace/.github/workflows/governance-gate.yml (checks under ci/governance/).
# No code is copied into consumers.
#
# Pin policy (owner decision 2026-08-25, SSOT: ci/governance/caller-policy.toml):
# pin by 40-hex COMMIT SHA — never a branch, and (target state) not a tag. The
# `governance-*` tag ruleset does block retag/delete, but it carries bypass actors
# (RepositoryRole, DeployKey, owner-always), so a tag is weaker than a SHA. The
# meta-enforcer `check_caller_pins.py` (workflow caller-pins.yml) verifies every
# fleet repo's caller: uses == umbrella-ref == canonical pin, inputs match policy.
#
# Rollout per repo:
#   1. cp this file to .github/workflows/governance.yml
#   2. replace BOTH `<PINNED-SHA>` below with the canonical pin from
#      ci/governance/caller-policy.toml (`pin.ref`)
#   3. inputs strict / runtime-scan / authority-guard: keep the defaults below unless
#      caller-policy.toml documents an override for this repo (now: prograph-vault,
#      robin-toolkit) — an undocumented deviation is a meta-enforcer finding
#   4. add "governance / gate" to the repo's branch ruleset as a required check (D4)
name: governance
permissions:
  contents: read          # gate only reads (2× checkout of public repos); least-privilege
on:
  pull_request:
  workflow_dispatch:

jobs:
  governance:
    uses: andrei-shtanakov/ai-orchestrators-workspace/.github/workflows/governance-gate.yml@<PINNED-SHA>
    with:
      umbrella-ref: "<PINNED-SHA>"   # same SHA as the uses: pin above
      strict: true
      runtime-scan: true        # runtime code — GOV-003 applies
      authority-guard: false    # -> true only in umbrella / prograph-vault
