name: tests
# Гоняет `ci/tests/`. До сих пор тесты в этом репо существовали, но их не запускал
# ни один workflow — то есть регрессия ловилась бы только тем, кто вспомнит про
# `pytest` локально. Для сторожа GOV-009 это особенно вредно: пропущенный путь в
# `DEFAULT_GLOBS` не проявляется как поломка, сторож просто ничего не находит и
# показывает зелёное. Тест без исполнителя такую дыру не закрывает, а маскирует.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версия Python задаётся явно, как в manifest-drift и plan-fields-sensor:
      # `pyproject.toml` требует >=3.12, и полагаться на то, что окажется в образе
      # раннера, — та же неявная зависимость, что и незаявленное право доступа.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setup-uv@v6 — та же мажорная версия, что у соседних workflow этого репо.
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q
