# ══════════════════════════ классы дефектов ══════════════════════════
#
# Ортогональны эпику (ADR-ECO-010 D2): баг внутри работы над эпиком несёт ОБА
# тега. Ставится только на починки. Список закрыт — расширяется этим же файлом.

[defect_classes.pipeline]
title = "Ошибки пайплайна"
notes = "Прогон, оркестрация, resume, очереди: работа не доходит до конца или доходит дважды."

[defect_classes.agent]
title = "Ошибки агентов"
notes = "Поведение модели/агента: неверный вывод, зацикливание, игнорирование инструкции, выдуманное свидетельство."

[defect_classes.code]
title = "Ошибки кода"
notes = "Обычный дефект реализации внутри репо."

[defect_classes.ui]
title = "Ошибки интерфейса"
notes = "Web, TUI, VSCode-расширение: показано не то, не показано, показано непонятно."

[defect_classes.contract]
title = "Ошибки контрактов"
notes = "Дрейф вендоренной копии, разъехавшиеся пины, схема против фикстур, нарушенная совместимость."

[defect_classes.ci]
title = "Ошибки инструмента и CI"
notes = "Гейт, сенсор, чекер: молчит когда должен падать, падает когда не должен, или измеряет не то. Отдельный класс, потому что зелёный прибор — не доказательство."
