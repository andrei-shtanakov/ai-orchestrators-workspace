# epics.toml — SSOT значений оси эпиков (ADR-ECO-010, схема: prograph-vault
# authored/contracts/epics/v1/registry.schema.json).
#
# Дом: командный зонтик, рядом с workspace-manifest.toml, и по той же причине:
# это общефлотовый факт, который меняется часто. Инструменты читают файл ЖИВЬЁМ
# по пути — он НЕ вендорится. Вендорится только грамматика (контракт epics/v1).
#
# Изменение = PR в зонтик под CODEOWNERS. Добавление программы, эпика, класса
# дефекта или сдвиг порога — обычная правка значений, НЕ ревизия контракта.
#
# ── Как читать поле `opened` в этом сиде ────────────────────────────────────
# Это дата, начиная с которой поток ДОКАЗУЕМО активен по артефактам репо (ADR,
# план, мерж PR), а не дата, когда владелец о нём подумал. У каждой записи в
# `notes` указано основание — по нему правку легко проверить или оспорить.
# Статусы в сиде проставлены по видимым артефактам и требуют подтверждения
# владельцем: снаружи не всегда отличить «поток идёт» от «поток замер».

schema_version = "1.0.0"
adopted_at     = "2026-09-01"

# ══════════════════════════ политика покрытия ══════════════════════════
#
# Две РАЗНЫЕ точки (ADR-ECO-010 D8): cutover разрешает сменить главную ось
# дайджеста Robin, missing_error_after — сделать EP-MISSING блокирующим.
# Совпади они, оставшиеся проценты встали бы поперёк CI.
#
# min_sample — защита знаменателя. Замер 2026-08-25: 2 открытых issue и
# 1 открытый PR на 20 репо; доля по такому знаменателю не измеряет дисциплину,
# её обваливает до нуля один случайный неразмеченный артефакт.

[coverage_policy]
robin_cutover_todo   = 0.98
robin_cutover_issues = 0.90
robin_cutover_prs    = 0.90
missing_error_after  = "2026-11-01"
min_sample           = 10

# ══════════════════════════ исключения ══════════════════════════
#
# ЕДИНСТВЕННОЕ место, где живут изъятия из обязательности. Изъятие, которого
# здесь нет, не существует: иначе «100 % покрытия» становится числом, которое
# зависит от того, кто считает.

[exclusions]
merge_commits = true
bot_authors   = ["dependabot[bot]", "copilot-pull-request-reviewer[bot]"]
paths         = ["**/vendor/**"]

